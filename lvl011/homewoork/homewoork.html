<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="text-align: center;">
    <h2>Users personal information</h2>
    <hr>
    <form action="">
        <!--space for full name-->
        <label for="Name">Enter your full name</label>
        <br>
        <input type="text" id="Name" placeholder="Name" name="name">
        <br><br>
        <!--space for email-->
        <label for="email">Enter your email</label>
        <br>
        <input type="email" id="email" placeholder="write your email" name="email">
        <br><br>
        <!--space for password-->
        <label for="password">Password</label>
        <br>
        <input type="password" id="password" placeholder="enter password" name="password">
        <br><br>
        <label for="password_1">Confirm password</label>
        <br>
        <input type="password" id="password_1" placeholder="confirm password" name="password_1">
        <br><br>
        <!--space for entering gender-->
        <h3>enter your gender</h3>
        <!--radio type for male-->
        <input type="radio" id="male" name="male">
        <label for="male">Male</label>
        <br>
        <!--female-->
        <input type="radio" id="female" name="female">
        <label for="female">Female</label>
        <br>
        <!--other-->
        <input type="radio" id="other" name="other">
        <label for="other">Other</label>
        <br><br>
        <!--date of birth-->
        <strong>
            <label for="Birth">Enter your date of birth</label>
        </strong>
        <br>
        <input type="date" id="Birth" placeholder="enter yout birthday" name="Date_of_birth" >
        <br><br>
        <!--space for address-->
        <strong>
            <label for="Address">Enter your address</label>
        </strong>
        <br>
        <input type="text" id="Address" placeholder="write your address" name="address">
        <br><br><br>
        <!--SUBMIT-->
        <button type="submit">
            <h3>
                Submit
            </h3>
        </button>
    </form>
</body>
</html>
