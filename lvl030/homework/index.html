<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <!-- 2) საიტზე დაამატეთ კონტეინერი, რომელშიც 5 შვილ Div-ს ჩააშენებთ. გამოიყენეთ 
     flex-grow იმისთვის, რომ პირველი ელემენტი იკავებდეს ყველაზე მეტ ადგილს, ხოლო 
     დანარჩენები თანაბრად გადანაწილდნენ. -->
     <h3>----2-----</h3><br>
    <div id="container1">
        <div id="div1_1"></div>
        <div class="div1_1"></div>
        <div class="div1_1"></div>
        <div class="div1_1"></div>
        <div class="div1_1"></div>
    </div>
    <br><br>
    <!-- 3) საიტზე დაამატეთ კონტეინერი, რომელშიც 3 შვილ Div-ს ჩააშენებთ. მხოლოდ 
     შუა ელემენტს მიანიჭეთ flex-grow: 1; დანარჩენებს 0. დააკვირდით შედეგს.-->
     <h3>----3----</h3><br>
    <div id="container2">
        <div class="div2_1"></div>
        <div id="div2_1"></div>
        <div class="div2_1"></div>
    </div>
    <!-- 6) კომენტარის სახით ახსენით რა დანიშნულება აქვს Flex-driection კუთვნილებას.
      მოიყვანეთ row, column, row-reverse და column-reverse მნიშვნელობების მაგალითები ცალ-ცალკე Html-ში. -->
    <h3>---6--- (row)</h3>
    <div id="container6">
        <div class="div6"></div>
        <div class="div6"></div>
        <div class="div6"></div>
    </div>
    <!-- ----6.2---- -->
    <h3>---6.2---- (colum)</h3>
    <div id="container6_2">
        <div class="div6_2"></div>
        <div class="div6_2"></div>
        <div class="div6_2"></div>
    </div>
    <!-- -----6.3------- -->
    <h3>---6.3--- (row-reverse)</h3>
    <div id="container6_3">
        <div class="div6_3"></div>
        <div class="div6_3"></div>
        <div class="div6_3"></div>
    </div>
    <!-- 8) გამოიყენეთ Flexbox და აქამდე ნასწავლი flex-ის 
    კუთვნილებები იმისთვის, რომ შექმნათ ანალოგიური ელემენტების განლაგებები: -->
    <br><br><br>
    <h3>----------8---------</h3>
    <div id="container">
        <!-- right -->
        <div id="right"></div>
        <!-- left -->
        <div id="left">
            <div id="div8_1"></div>
            <div id="div8_2">
                <div id="div8_2_1"></div>
                <div id="div8_2_2"></div>
            </div>
            <div id="div8_3"></div>
        </div>
    </div><br><br>
    <!-- ------- 9 ---------- -->
     <h3>------9-------</h3>
     <div id="container9">
        <!-- top1 -->
        <div id="top1">
            <div id="top1_1"></div>
            <div id="top1_2"></div>
            <div id="top1_3"></div>
        </div>
        <!-- top2 -->
        <div id="top2">
            <div id="top2_1"></div>
            <div id="top2_2"></div>
            <div id="top2_3"></div>
        </div>
        <div id="top3">
            <div id="top3_1"></div>
            <div id="top3_2"></div>
            <div id="top3_3"></div>
        </div>
        <div id="top4">
            <div id="top4_1"></div>
            <div id="top4_2"></div>
            <div id="top4_3"></div>
            <div id="top4_4"></div>
            <div id="top4_5"></div>
        </div>
     </div>
</body>
</html>
