    <!-- 1) შექმენით transition, სადაც:
    გექნებათ კვადრატის ფორმის, ლურჯი div ბლოკი, რომელიც გაცენტრილი იქნება. მაუსის გადატარების დროს თქვენ იგი 
    წრის ფორმის წითელ div-ად უნდა გადააქციოთ. ცვლილება მოხდეს 3 წამის განმავლობაში, 1 წამის დაყოვნებით. 
    მისი timing-function linear უნდა იყოს. -->

        <div id="div1"></div>
    </div>
    <br><br>
    <!-- 2) შექმენით transition, სადაც:

    მოუმრგვალოთ და დაუმატოთ 2px solid red ბორდერი. გარდაქმნა მოხდეს 2 წამის განმავლობაში. 
    მისი timing-function default უნდა იყოს. -->
    <div id="maidiv2">
